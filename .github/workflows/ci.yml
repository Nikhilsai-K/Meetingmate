name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Extension + Web (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @meetingmate/extension run typecheck
      - run: pnpm --filter @meetingmate/extension run test
      - run: pnpm --filter @meetingmate/extension run build
      - name: Check extension bundle size (< 3MB)
        run: |
          total=$(du -sb apps/extension/dist | cut -f1)
          echo "Bundle: $total bytes"
          test "$total" -lt 3145728
      - name: Manifest lint
        run: pnpm --filter @meetingmate/extension exec web-ext lint -s dist --self-hosted || true
      - run: pnpm --filter @meetingmate/web run typecheck
      - run: pnpm --filter @meetingmate/web run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci
          CLERK_SECRET_KEY: sk_test_ci

  python:
    name: API + Worker (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install API
        run: |
          cd apps/api
          pip install -e '.[dev]'
      - name: Ruff
        run: cd apps/api && ruff check src tests
      - name: Mypy (non-blocking)
        run: cd apps/api && mypy src || true
      - name: Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost/test
          REDIS_URL: redis://localhost:6379/1
          QDRANT_URL: http://localhost:6333
          S3_BUCKET_TRANSCRIPTS: test-bucket
          S3_ACCESS_KEY_ID: test
          S3_SECRET_ACCESS_KEY: test
          CLERK_SECRET_KEY: sk_test_ci
          CLERK_JWKS_URL: https://example.com/jwks
          CLERK_ISSUER: https://example.com
          ANTHROPIC_API_KEY: fake
          DEEPGRAM_API_KEY: fake
          VOYAGE_API_KEY: fake
          COHERE_API_KEY: fake
        run: cd apps/api && pytest -q
