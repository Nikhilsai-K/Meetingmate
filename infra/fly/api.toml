# Fly.io config for the MeetingMate API.
# Deployed in Tokyo for low-latency audio relay to Japanese users.

app = "meetingmate-api"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  LOG_LEVEL = "info"
  API_BASE_URL = "https://api.meetingmate.app"
  WEB_BASE_URL = "https://meetingmate.app"

[[services]]
  internal_port = 8000
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true
  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [services.concurrency]
    type = "connections"
    hard_limit = 500
    soft_limit = 250

  [[services.http_checks]]
    interval = "10s"
    timeout = "3s"
    grace_period = "10s"
    method = "get"
    path = "/v1/health"

[deploy]
  release_command = "alembic upgrade head"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
