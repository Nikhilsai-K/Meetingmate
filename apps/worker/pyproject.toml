[project]
name = "meetingmate-worker"
version = "1.0.0"
description = "Celery worker for MeetingMate: post-meeting notes, embeddings, RAG, integration sync"
requires-python = ">=3.12"
dependencies = [
  "meetingmate-api",
  "celery[redis]==5.4.0",
  "anthropic==0.39.0",
  "qdrant-client==1.12.1",
  "voyageai==0.3.1",
  "sqlalchemy==2.0.36",
  "asyncpg==0.30.0",
  "psycopg[binary]==3.2.3",
  "pydantic==2.9.2",
  "pydantic-settings==2.6.1",
  "httpx==0.27.2",
  "structlog==24.4.0",
  "sentry-sdk==2.18.0",
  "boto3==1.35.63",
  "reportlab==4.2.5",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
  "ruff==0.7.4",
  "mypy==1.13.0",
]

[tool.uv.sources]
meetingmate-api = { path = "../api" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meetingmate_worker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
